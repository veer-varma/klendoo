name: CI and guarded VPS deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klendoo-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js when applicable
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run available validation commands
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "No package.json is present yet; source validation is not applicable."
            exit 0
          fi
          npm ci
          npm run type-check --if-present
          npm test --if-present
          npm run lint --if-present

  deploy_production:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine whether an application deployment manifest exists
        id: manifest
        shell: bash
        run: |
          if [[ -f docker-compose.yml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No docker-compose.yml is present; safely skipping VPS deployment."
          fi

      - name: Install the deployment key and pinned host entry
        if: steps.manifest.outputs.ready == 'true'
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/klendoo_deploy_key
          chmod 600 ~/.ssh/klendoo_deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # /opt/klendoo/shared/.env is intentionally outside every per-release
      # directory (rsync excludes .env/.env.* above) so it persists across
      # deploys — most importantly DATABASE_URL, which must stay identical
      # release to release or the next deploy can't authenticate against
      # the existing Postgres volume. Rewritten every deploy from these
      # secrets, which is safe: same values in, same file out.
      #
      # Every secret referenced here was already provisioned directly in
      # GitHub by Manus/Veer on 2026-08-19 (see BACKLOG.md) — this step
      # doesn't require adding anything new, just wiring the names through.
      - name: Render production environment file on the VPS
        if: steps.manifest.outputs.ready == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          HOST_SESSION_SECRET: ${{ secrets.HOST_SESSION_SECRET }}
          KLENDOO_PAYTO_ADDRESS: ${{ secrets.KLENDOO_PAYTO_ADDRESS }}
          INTERMEZZO_GATEWAY_URL: ${{ secrets.INTERMEZZO_GATEWAY_URL }}
          KLENDOO_INTERMEZZO_API_KEY: ${{ secrets.KLENDOO_INTERMEZZO_API_KEY }}
          POSTMARK_SERVER_API_TOKEN: ${{ secrets.POSTMARK_SERVER_API_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p /opt/klendoo/shared && umask 077 && cat > /opt/klendoo/shared/.env" <<EOF
          DATABASE_URL=${DATABASE_URL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
          HOST_SESSION_SECRET=${HOST_SESSION_SECRET}
          KLENDOO_PAYTO_ADDRESS=${KLENDOO_PAYTO_ADDRESS}
          ALGOD_NETWORK=testnet
          FACILITATOR_URL=https://facilitator.goplausible.xyz
          PUBLIC_BASE_URL=https://klendoo.com
          HOST_DASHBOARD_BASE_URL=https://app.klendoo.com
          DEFAULT_ACTION_PRICE_USDC=0.15
          INTERMEZZO_GATEWAY_URL=${INTERMEZZO_GATEWAY_URL}
          KLENDOO_INTERMEZZO_API_KEY=${KLENDOO_INTERMEZZO_API_KEY}
          POSTMARK_SERVER_API_TOKEN=${POSTMARK_SERVER_API_TOKEN}
          POSTMARK_FROM_EMAIL=ops@klendoo.com
          ACME_EMAIL=ops@klendoo.com
          EOF

      - name: Publish release and run stable Compose deployment
        if: steps.manifest.outputs.ready == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_RELEASE="/opt/klendoo/releases/${RELEASE_ID}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e 'ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            ./ "${VPS_USER}@${VPS_HOST}:${REMOTE_RELEASE}/"
          ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "REMOTE_RELEASE='${REMOTE_RELEASE}' bash -s" <<'REMOTE'
          set -euo pipefail
          # A release directory is intentionally immutable and named by SHA, but
          # the running Compose project must be stable. Retire only earlier
          # Klendoo release projects; `down` retains the explicitly named data
          # and certificate volumes and never touches the legacy klendoo-deploy
          # stack outside /opt/klendoo/releases.
          for previous_release in /opt/klendoo/releases/*; do
            [ -f "$previous_release/docker-compose.yml" ] || continue
            previous_project="$(basename "$previous_release")"
            docker compose -p "$previous_project" --env-file /opt/klendoo/shared/.env -f "$previous_release/docker-compose.yml" down --remove-orphans || true
          done
          cd "$REMOTE_RELEASE"
          docker compose -p klendoo --env-file /opt/klendoo/shared/.env up -d --build --remove-orphans
          ln -sfn "$REMOTE_RELEASE" /opt/klendoo/current
          docker compose -p klendoo ps
          REMOTE
