name: CI and guarded VPS deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klendoo-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js when applicable
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run available validation commands
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "No package.json is present yet; source validation is not applicable."
            exit 0
          fi
          npm ci
          npm run type-check --if-present
          npm test --if-present
          npm run lint --if-present

  deploy_production:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine whether an application deployment manifest exists
        id: manifest
        shell: bash
        run: |
          if [[ -f docker-compose.yml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No docker-compose.yml is present; safely skipping VPS deployment."
          fi

      - name: Install the deployment key
        if: steps.manifest.outputs.ready == 'true'
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/klendoo_deploy_key
          chmod 600 ~/.ssh/klendoo_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publish release and run Compose deployment
        if: steps.manifest.outputs.ready == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_RELEASE="/opt/klendoo/releases/${RELEASE_ID}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e 'ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes' \
            ./ "${VPS_USER}@${VPS_HOST}:${REMOTE_RELEASE}/"
          ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail; cd '${REMOTE_RELEASE}'; docker compose --env-file /opt/klendoo/shared/.env up -d --build; ln -sfn '${REMOTE_RELEASE}' /opt/klendoo/current"
