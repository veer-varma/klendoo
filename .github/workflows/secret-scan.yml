name: Secret scan

# Deliberately a separate workflow from ci-deploy.yml (the Ops Agent's guarded
# deploy pipeline) rather than adding a step there — this only reads history,
# never deploys, so it doesn't need to touch that file at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
