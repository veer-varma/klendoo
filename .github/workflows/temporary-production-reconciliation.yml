name: Temporary production reconciliation inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-production-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect_runtime:
    name: Read current Klendoo runtime state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned SSH settings
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/klendoo_deploy_key
          chmod 600 ~/.ssh/klendoo_deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect release ownership, routes, and preserved database
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/klendoo_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "== Current Klendoo release symlink =="
          readlink -f /opt/klendoo/current || true
          echo "== Compose projects =="
          docker compose ls
          echo "== Every hash-named release container =="
          docker ps -a --format 'name={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}' | grep -E 'name=[0-9a-f]{40}-' || true
          echo "== Legacy Klendoo and Traefik containers =="
          docker ps -a --format 'name={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}' | grep -E '(klendoo|traefik)' || true
          echo "== Relevant container provenance and router labels =="
          docker ps -a --format '{{.Names}}' | grep -E '(klendoo|traefik|host-dashboard|host-onboarding|landing|negotiation-agent|followup-reminder-agent)' | while read -r name; do
            docker inspect --format 'name={{.Name}} state={{.State.Status}} created={{.Created}} networks={{range $key, $_ := .NetworkSettings.Networks}}{{$key}} {{end}} mounts={{range .Mounts}}{{.Name}}:{{.Destination}} {{end}} labels={{json .Config.Labels}}' "$name"
          done
          echo "== Legacy database preservation =="
          docker inspect --format 'name={{.Name}} state={{.State.Status}} mounts={{range .Mounts}}{{.Name}}:{{.Destination}} {{end}}' klendoo-db
          echo "== Klendoo database volumes =="
          docker volume ls --format '{{.Name}}' | grep -E 'klendoo.*db|db.*klendoo' || true
          REMOTE
